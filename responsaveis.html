<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsáveis por Área</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <img src="imagens/logo-jde.png" alt="JDE Logo" class="logo-jde" />
                <div>
                    <h1>👔 Responsáveis por Área</h1>
                    <p>Gestores responsáveis por cada área</p>
                </div>
            </div>
            <a href="index.html" class="btn-voltar">← Voltar</a>
        </header>

        <div class="filtros">
            <div>
                <label>🔍 Buscar por Nome:</label>
                <input type="text" id="filtroNomeResponsaveis" placeholder="Digite o nome..." />
            </div>
            <div>
                <label>📂 Filtrar por Área:</label>
                <select id="filtroAreaResponsaveis">
                    <option value="TODAS">TODAS AS ÁREAS</option>
                </select>
            </div>
            <span class="contador" id="contador-responsaveis">0 registros</span>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Áreas Responsáveis</th>
                    </tr>
                </thead>
                <tbody id="tabela-responsaveis">
                    <tr><td colspan="3" style="text-align:center;padding:30px;">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer-actions">
            <div class="qr-code">
                <img id="qrResponsaveis" src="" alt="QR Code" />
                <p>📱 Acesse pelo celular</p>
            </div>
        </div>

        <footer>
            <div class="footer-left">
                <img src="imagens/logo-jde.png" alt="JDE" class="logo-footer" />
                <span>📅 <span id="data-atualizacao">Carregando...</span></span>
                <span>|</span>
                <span id="status-servidor">🟡 Verificando servidor...</span>
                <span>|</span>
                <span>📌 Versão 4.0</span>
                <span>|</span>
                <span>🏢 Matriz PTW</span>
            </div>
            <div class="footer-right">
                <a href="admin.html" class="btn-voltar">🔐 Admin</a>
                <button onclick="window.location.href='index.html'" class="btn-atualizar">🏠 Início</button>
                <button onclick="atualizarDados()" class="btn-atualizar">🔄 Recarregar</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
